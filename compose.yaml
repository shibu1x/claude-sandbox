services:
  claude-sandbox:
    image: ${REGISTRY}/claude-sandbox:latest
    stdin_open: true
    tty: true
    working_dir: /workspace
    volumes:
      # Mount the project you want Claude Code to work on
      - ./workspace:/workspace
      # Persist Claude Code auth/config between container runs
      - claude-config:/home/ubuntu/.claude

volumes:
  claude-config:
